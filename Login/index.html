<!DOCTYPE html>
<html lang="uk">
<head>
	<title>Login</title>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<link href="images/icons/favicon.ico" rel="shortcut icon" type="image/x-icon" />
	<link rel="stylesheet" type="text/css" href="vendor/bootstrap/css/bootstrap.min.css" />
	<link rel="stylesheet" type="text/css" href="fonts/font-awesome-4.7.0/css/font-awesome.min.css" />
	<link rel="stylesheet" type="text/css" href="vendor/animate/animate.css" />
	<link rel="stylesheet" type="text/css" href="vendor/css-hamburgers/hamburgers.min.css" />
	<link rel="stylesheet" type="text/css" href="vendor/animsition/css/animsition.min.css" />
	<link rel="stylesheet" type="text/css" href="vendor/select2/select2.min.css" />
	<link rel="stylesheet" type="text/css" href="vendor/daterangepicker/daterangepicker.css" />
	<link rel="stylesheet" type="text/css" href="css/util.css" />
	<link rel="stylesheet" type="text/css" href="css/main.css" />
</head>
<body>

	<div class="limiter">
		<div class="container-login100">
			<div class="wrap-login100">
				<form class="login100-form validate-form p-l-55 p-r-55 p-t-178">
					<span class="login100-form-title">
						Вхід
					</span>

					<div class="wrap-input100 validate-input m-b-16" data-validate="Введіть свій логін">
						<input class="input100" type="text" name="username" placeholder="Логін" />
						<span class="focus-input100"></span>
					</div>

					<div class="wrap-input100 validate-input m-b-16" data-validate="Введіть свій пароль">
						<input class="input100" type="password" name="pass" placeholder="Пароль" />
						<span class="focus-input100"></span>
					</div>

					<div class="text-right p-t-13 p-b-23">
						<span class="txt1">Забули</span>
						<a href="#" class="txt2">Логін / Пароль?</a>
					</div>

					<div class="container-login100-form-btn">
						<button class="login100-form-btn" type="submit">Увійти</button>
					</div>

					<div class="flex-col-c p-t-170 p-b-40">
						<span class="txt1 p-b-9">Немає аккаунту?</span>
						<a href="#" class="txt3">Зарегіструйтесь зараз</a>
					</div>
				</form>
			</div>
		</div>
	</div>

	<script src="vendor/jquery/jquery-3.2.1.min.js"></script>
	<script src="vendor/animsition/js/a	nimsition.min.js"></script>
	<script src="vendor/bootstrap/js/popper.js"></script>
	<script src="vendor/bootstrap/js/bootstrap.min.js"></script>
	<script src="vendor/select2/select2.min.js"></script>
	<script src="vendor/daterangepicker/moment.min.js"></script>
	<script src="vendor/daterangepicker/daterangepicker.js"></script>
	<script src="vendor/countdowntime/countdowntime.js"></script>
	<script src="js/main.js"></script>

	<script>
		document.addEventListener("DOMContentLoaded", function () {
			const registerLink = document.querySelector(".txt3");
			const formTitle = document.querySelector(".login100-form-title");
			const form = document.querySelector(".login100-form");
			const loginButton = document.querySelector(".login100-form-btn");
			const forgotBlock = document.querySelector(".text-right");
			const footerBlock = document.querySelector(".flex-col-c");

			let isRegistering = false;

			const urlParams = new URLSearchParams(window.location.search);
			const returnTo = urlParams.get("return") || "../Main.html";

			function createPhoneField() {
				const phoneWrapper = document.createElement("div");
				phoneWrapper.className = "wrap-input100 validate-input m-b-16";
				phoneWrapper.setAttribute("data-validate", "Введіть свій номер телефону");

				phoneWrapper.innerHTML = `
					<input class="input100" type="tel" name="phone" placeholder="Номер телефону" />
					<span class="focus-input100"></span>
				`;

				return phoneWrapper;
			}

			function createFooterLink(text, linkText, linkClass) {
				const footer = document.createElement("div");
				footer.className = "flex-col-c p-t-170 p-b-40";

				footer.innerHTML = `
					<span class="txt1 p-b-9">${text}</span>
					<a href="#" class="txt3 ${linkClass}">${linkText}</a>
				`;

				return footer;
			}

			registerLink.addEventListener("click", function (e) {
				e.preventDefault();
				isRegistering = true;

				formTitle.textContent = "Реєстрація";
				loginButton.textContent = "Зареєструватися";

				if (footerBlock) footerBlock.remove();

				if (!document.querySelector("input[name='phone']")) {
					const phoneField = createPhoneField();
					const passwordInput = form.querySelector("input[name='pass']").closest(".wrap-input100");
					passwordInput.insertAdjacentElement("afterend", phoneField);
				}

				form.appendChild(forgotBlock);

				const newFooter = createFooterLink("У вас вже є аккаунт?", "Увійдіть зараз", "back-to-login");
				form.appendChild(newFooter);

				document.querySelector(".back-to-login").addEventListener("click", function (e) {
					e.preventDefault();
					isRegistering = false;

					formTitle.textContent = "Вхід";
					loginButton.textContent = "Увійти";

					const phoneInput = document.querySelector("input[name='phone']");
					if (phoneInput) phoneInput.closest(".wrap-input100").remove();

					newFooter.remove();

					form.insertBefore(forgotBlock, document.querySelector(".container-login100-form-btn"));

					form.appendChild(footerBlock);
				});
			});

			form.addEventListener("submit", function (e) {
				e.preventDefault();

				const username = form.querySelector("input[name='username']").value.trim();
				const password = form.querySelector("input[name='pass']").value.trim();

				if (isRegistering) {
					const phone = form.querySelector("input[name='phone']").value.trim();

					if (!username || !password || !phone) {
						alert("Будь ласка, заповніть всі поля");
						return;
					}

					localStorage.setItem("user", JSON.stringify({
						username: username,
						password: password,
						phone: phone
					}));

					alert("Реєстрація пройшла успішно!");
					document.querySelector(".back-to-login").click();

				} else {
					const savedUser = JSON.parse(localStorage.getItem("user"));

					if (savedUser && savedUser.username === username && savedUser.password === password) {
						alert("Вхід виконано успішно!");
						window.location.href = returnTo;
					} else {
						alert("Невірний логін або пароль!");
					}
				}
			});
		});
	</script>
</body>
</html>
